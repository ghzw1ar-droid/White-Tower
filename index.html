<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فندق البرج الأبيض | White Tower Hotel</title>
<meta name="description" content="فندق البرج الأبيض: إقامة فاخرة وضيافة عراقية أصيلة. احجز مباشرة عبر واتساب. White Tower Hotel – luxury stay in Iraq.">
<meta property="og:title" content="فندق البرج الأبيض | White Tower Hotel">
<meta property="og:description" content="Luxury stays, fine dining, spa and 24/7 service. احجز عبر واتساب.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/images/exterior.jpg">
<link rel="icon" href="assets/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="nav glass" id="nav">
  <a class="brand" href="#home" aria-label="White Tower Hotel"><img src="assets/images/logo.jpg" alt="" width="44" height="44"><span data-i18n="hotel"></span></a>
  <nav id="links" aria-label="Main">
    <a href="#home" data-i18n="home"></a><a href="#rooms" data-i18n="rooms"></a><a href="#services" data-i18n="services"></a><a href="#book" data-i18n="contact"></a>
  </nav>
  <div class="tools">
    <button class="pill" id="langBtn" aria-label="Language">EN</button>
    <a class="btn sm" href="#book" data-i18n="book"></a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
  </div>
</header>

<main>
<section class="hero" id="home">
  <div class="slides" id="slides"></div><canvas id="dust" aria-hidden="true"></canvas><div class="shade"></div>
  <div class="hero-in">
    <h1 data-i18n="heroT"></h1><p data-i18n="heroP"></p>
    <a class="btn" href="#book" data-i18n="heroB"></a>
  </div>
  <form class="quick glass" id="quick" onsubmit="return false">
    <label><span data-i18n="cin"></span><input type="date" id="qIn"></label>
    <label><span data-i18n="cout"></span><input type="date" id="qOut"></label>
    <label><span data-i18n="guests"></span><input type="number" id="qG" min="1" max="12" value="2"></label>
    <button class="btn" id="qGo" data-i18n="check"></button>
  </form>
</section>

<section class="sec" id="rooms">
  <div class="head reveal"><h2 data-i18n="roomsT"></h2><p data-i18n="roomsP"></p>
    <div class="toggles">
      <div class="seg" id="modeSeg"><button data-m="night" class="on" data-i18n="night"></button><button data-m="week" data-i18n="week"></button></div>
      <div class="seg" id="curSeg"><button data-c="iqd" class="on">IQD · د.ع</button><button data-c="usd">USD · $</button></div>
    </div>
  </div>
  <div class="grid rooms" id="roomGrid"></div>
</section>

<section class="sec alt" id="services">
  <div class="head reveal"><h2 data-i18n="servT"></h2><div class="seg" id="tabs"></div></div>
  <div class="grid serv" id="servGrid"></div>
</section>

<section class="sec" id="book">
  <div class="head reveal"><h2 data-i18n="calcT"></h2></div>
  <form class="calc glass reveal" id="calc" onsubmit="return false">
    <label><span data-i18n="room"></span><select id="cRoom"></select></label>
    <label><span data-i18n="cin"></span><input type="date" id="cIn"></label>
    <label><span data-i18n="cout"></span><input type="date" id="cOut"></label>
    <label><span data-i18n="nRooms"></span><input type="number" id="cRooms" min="1" max="10" value="1"></label>
    <label><span data-i18n="guests"></span><input type="number" id="cG" min="1" max="20" value="2"></label>
    <label><span data-i18n="name"></span><input type="text" id="cName" autocomplete="name"></label>
    <label><span data-i18n="phone"></span><input type="tel" id="cPhone" autocomplete="tel" inputmode="tel"></label>
    <fieldset><legend data-i18n="extras"></legend><div id="addons"></div></fieldset>
    <label class="wide"><span data-i18n="notes"></span><textarea id="cNotes" rows="2"></textarea></label>
    <div class="sum wide">
      <div><small data-i18n="nights"></small><b id="sN">0</b></div>
      <div><small data-i18n="total"></small><b><span id="sT" data-v="0">0</span> <em data-i18n="iqd"></em></b></div>
      <button class="btn" id="send" data-i18n="send"></button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </form>
</section>
</main>

<footer class="foot"><img src="assets/images/logo.jpg" alt="" width="56" height="56"><p><span data-i18n="hotel"></span> · 07709111166</p><small>© 2026 <span data-i18n="rights"></span></small></footer>

<div class="wa" id="wa"><span class="tip glass" data-i18n="wTip"></span>
  <a href="#" id="waBtn" aria-label="WhatsApp"><span aria-hidden="true" style="font-size:1.7rem">💬</span></a></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true">
  <button class="x" id="lbX" aria-label="Close">✕</button><button class="nv p" id="lbP" aria-label="Previous">‹</button>
  <img id="lbImg" alt=""><button class="nv n" id="lbN" aria-label="Next">›</button><div class="th" id="lbT"></div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
